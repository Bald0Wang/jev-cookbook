<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>狼人杀 · Jev 离线演示</title>
  <style>
    :root { color-scheme: dark; --bg: #10131a; --panel: #191e29; --panel-2: #202737; --line: #303a4f; --text: #eef3ff; --muted: #aab6ca; --accent: #7dd3fc; --good: #86efac; --bad: #fca5a5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 20% -10%, #263653 0, transparent 42%), var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(1180px, calc(100% - 32px)); margin: 24px auto 60px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1, h2, p { margin: 0; } h1 { font-size: 30px; letter-spacing: -.02em; } h2 { font-size: 17px; margin-bottom: 12px; }
    .sub { color: var(--muted); margin-top: 5px; }
    .toolbar, .panel { background: rgba(25, 30, 41, .92); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 35px rgba(0,0,0,.16); }
    .toolbar { padding: 12px; display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    input, textarea, select, button { font: inherit; border-radius: 9px; border: 1px solid var(--line); }
    input, textarea, select { background: #111722; color: var(--text); padding: 9px 10px; }
    input { width: 150px; } textarea { width: 100%; min-height: 76px; resize: vertical; }
    button { background: var(--panel-2); color: var(--text); padding: 9px 13px; cursor: pointer; }
    button:hover { border-color: var(--accent); } button.primary { color: #052234; background: var(--accent); border-color: transparent; font-weight: 700; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .status { margin: 16px 0; padding: 12px 14px; border-radius: 10px; background: rgba(125,211,252,.08); border: 1px solid rgba(125,211,252,.25); color: var(--accent); }
    .status.good { color: var(--good); border-color: rgba(134,239,172,.3); background: rgba(134,239,172,.08); } .status.bad { color: var(--bad); border-color: rgba(252,165,165,.3); background: rgba(252,165,165,.08); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(360px, .95fr); gap: 16px; }
    .panel { padding: 16px; } .panel + .panel { margin-top: 16px; }
    .transcript { min-height: 390px; max-height: 590px; overflow: auto; display: grid; gap: 9px; align-content: start; }
    .message { padding: 10px 12px; border-radius: 10px; background: #141a25; border: 1px solid #283247; }
    .message.system { border-color: #665b34; background: #211f17; } .message.round { border-color: #3b82f6; background: rgba(59,130,246,.14); color: #bfdbfe; text-align: center; font-weight: 700; letter-spacing: .03em; } .message.round .speaker { color: #93c5fd; } .speaker { color: var(--accent); font-weight: 700; margin-right: 8px; } .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .player { display: block; padding: 10px; background: #141a25; border: 1px solid #283247; border-radius: 9px; } .player.active { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(125,211,252,.2); } .player-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .last-decision { color: var(--muted); font-size: 11px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player.dead { opacity: .48; } .pill { color: var(--muted); font-size: 12px; } .pill.alive { color: var(--good); } .claim { color: #fcd34d; font-size: 12px; margin-left: 7px; }
    .controls { display: grid; gap: 9px; } .row { display: flex; gap: 8px; align-items: center; } .row > * { flex: 1; } .row button { flex: 0 0 auto; }
    .small { color: var(--muted); font-size: 12px; } .decision-details { margin-top: 9px; border-top: 1px solid #2b3850; padding-top: 7px; color: #cbd5e1; font-size: 12px; } .decision-details summary { cursor: pointer; color: #a5b4fc; } .decision-grid { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-top: 7px; } .probability { display: grid; grid-template-columns: 80px 1fr 42px; gap: 6px; align-items: center; margin-top: 5px; } .probability-track { height: 6px; border-radius: 9px; background: #293449; overflow: hidden; } .probability-fill { height: 100%; background: linear-gradient(90deg, #a78bfa, #67e8f9); } .decision-source { color: #c4b5fd; } .decision-source.jev { color: #67e8f9; } .decision-source.fallback { color: #fbbf24; } pre { overflow: auto; max-height: 450px; white-space: pre-wrap; word-break: break-word; color: #c7d2fe; background: #0d1119; padding: 12px; border-radius: 8px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .players { grid-template-columns: repeat(3, minmax(145px, 1fr)); overflow-x: auto; } header { display: block; } .toolbar { margin-top: 14px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>狼人杀 · Jev</h1><p class="sub">1 名真人 + 5 个 Jev · 结构化判断 · 服务器端身份隔离</p></div>
      <div class="toolbar"><label class="small" for="seed">Seed</label><input id="seed" value="20260921" inputmode="numeric"><button class="primary" id="newGame">新局</button><button id="advance">推进一步</button></div>
    </header>
    <div id="status" class="status">点击“新局”开始。无 API key 时会使用固定策略离线运行。</div>
    <div class="layout">
      <section>
        <div class="panel"><h2>公共聊天</h2><div id="transcript" class="transcript"></div></div>
        <div class="panel controls"><h2>你的回合</h2><div id="turnHint" class="small">等待游戏推进。</div><textarea id="message" maxlength="280" placeholder="轮到你发言时，在这里输入最多 280 个字符。"></textarea><button id="sendMessage" class="primary">发送发言</button><div class="row"><select id="voteTarget"></select><button id="sendVote" class="primary">提交投票</button></div><div class="small">普通视图只显示你的身份；其他角色的私有 state 不会下发。</div></div>
      </section>
      <aside>
        <div class="panel"><h2>玩家与最近判断</h2><div id="round" class="small">尚未开始</div><div id="players" class="players" style="margin-top:12px"></div></div>
        <div class="panel"><h2>本轮 Jev 判断</h2><div id="decisionFeed" class="small">推进游戏后显示公开判断。</div></div>
        <div class="panel"><h2>你的私有信息</h2><div id="privateState" class="small">尚未开始</div></div>
        <div class="panel"><h2>调试</h2><div class="row"><button id="revealDebug">揭示身份</button><button id="saveTrace">保存 trace</button></div><pre id="debug" hidden></pre></div>
      </aside>
    </div>
  </main>
  <script>
    const labels = { werewolf: '狼人', seer: '预言家', witch: '女巫', villager: '村民' };
    const phaseLabels = { night: '夜晚', day_discussion: '白天发言', voting: '投票', finished: '已结束' };
    let gameId = null, game = null, privateState = null;
    const $ = id => document.getElementById(id);
    async function api(path, body) {
      const buttons = ['newGame', 'advance', 'sendMessage', 'sendVote'];
      buttons.forEach(id => { $(id).disabled = true; });
      if (path.endsWith('/human-message')) setStatus('发言已提交，其他玩家正依次用 DeepSeek 分析并发言，请稍候……');
      if (path.endsWith('/vote')) setStatus('正在分析投票，由 Jev 选择目标……');
      try {
        const response = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await response.json(); if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`); return data;
      } finally { buttons.forEach(id => { $(id).disabled = false; }); if (game) render(); }
    }
    function setStatus(text, kind = '') { $('status').textContent = text; $('status').className = `status ${kind}`; }
    function nameOf(id) { return game?.humanId === id ? '你' : id.replace('jev_', 'Jev-'); }
    const intentLabels = { accuse_player: '指控', defend_self: '自辩', support_player: '支持', claim_role: '声明身份', question_claim: '质疑身份', share_result: '分享查验', change_vote: '解释改票', remain_silent: '保留意见' };
    function decisionSource(decision) { return decision.mode === 'jev' ? 'Jev 判断' : decision.mode === 'deepseek' ? 'DeepSeek 分析' : 'fallback'; }
    function decisionTarget(decision) { return decision.choice?.target ? nameOf(decision.choice.target) : '—'; }
    function appendDecisionDetails(parent, decision) {
      if (!decision) return;
      const details = document.createElement('details'); details.className = 'decision-details';
      const summary = document.createElement('summary'); summary.textContent = `Jev 判断 · ${decisionSource(decision)} · confidence ${(Number(decision.confidence || 0) * 100).toFixed(0)}%`; details.append(summary);
      const grid = document.createElement('div'); grid.className = 'decision-grid';
      const rows = [['阶段', decision.phase === 'day_speech' ? '白天发言' : decision.phase === 'vote' ? '投票' : decision.phase], ['选择', intentLabels[decision.choice?.intent] || decision.choice?.intent || '投票目标'], ['目标', decisionTarget(decision)], ['证据', decision.choice?.evidence || '—']];
      rows.forEach(([key, value]) => { const k = document.createElement('span'); k.textContent = key; const v = document.createElement('strong'); v.textContent = value; grid.append(k, v); });
      details.append(grid);
      if (decision.probabilities?.length) { const label = document.createElement('div'); label.className = 'meta'; label.textContent = '候选概率'; details.append(label); decision.probabilities.forEach(item => { const row = document.createElement('div'); row.className = 'probability'; const name = document.createElement('span'); name.textContent = nameOf(item.target); const track = document.createElement('div'); track.className = 'probability-track'; const fill = document.createElement('div'); fill.className = 'probability-fill'; fill.style.width = `${Math.round(item.probability * 100)}%`; track.append(fill); const value = document.createElement('span'); value.textContent = `${Math.round(item.probability * 100)}%`; row.append(name, track, value); details.append(row); }); }
      parent.append(details);
    }
    function render() {
      if (!game) return;
      const phase = phaseLabels[game.phase] || game.phase;
      $('round').textContent = `第 ${game.round} 轮 · ${phase} · ${game.ruleset === 'demo' ? '演示节奏：平票线继续' : '标准规则'} · ${game.mode === 'auto' ? '白天 DeepSeek 分析 / 技能与投票 Jev 判断' : '离线回放'}`;
      $('players').replaceChildren(...game.players.map(player => { const row = document.createElement('div'); row.className = `player ${player.alive ? '' : 'dead'} ${game.awaitingHuman === player.id ? 'active' : ''}`; const head = document.createElement('div'); head.className = 'player-head'; const left = document.createElement('span'); left.textContent = nameOf(player.id); if (player.claim) { const claim = document.createElement('span'); claim.className = 'claim'; claim.textContent = `声称${labels[player.claim] || player.claim}`; left.append(claim); } const right = document.createElement('span'); right.className = `pill ${player.alive ? 'alive' : ''}`; right.textContent = player.alive ? '存活' : '出局'; head.append(left, right); row.append(head); if (player.lastDecision) { const recent = document.createElement('div'); recent.className = 'last-decision'; recent.textContent = `${decisionSource(player.lastDecision)} · ${intentLabels[player.lastDecision.choice?.intent] || (player.lastDecision.choice?.target ? `目标 ${nameOf(player.lastDecision.choice.target)}` : '暂无选择')} · ${(Number(player.lastDecision.confidence || 0) * 100).toFixed(0)}%`; row.append(recent); } return row; }));
      const publicDecisions = game.publicDecisions || [];
      $('transcript').replaceChildren(...(game.publicTranscript || []).map(item => { const el = document.createElement('div'); el.className = `message ${item.speaker === 'system' ? 'system' : ''} ${item.type === 'round_start' ? 'round' : ''}`; const speaker = document.createElement('span'); speaker.className = 'speaker'; speaker.textContent = item.type === 'round_start' ? '☀' : item.speaker === 'system' ? '系统' : nameOf(item.speaker); const body = document.createElement('span'); body.textContent = item.text || ''; el.append(speaker, body); if (item.intent || item.evidence) { const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = [item.intent, item.evidence, item.source].filter(Boolean).join(' · '); el.append(meta); } appendDecisionDetails(el, publicDecisions.find(decision => decision.seq === item.decisionSeq)); return el; }));
      const latest = publicDecisions.slice(-6).reverse(); const feed = $('decisionFeed'); feed.replaceChildren(); if (!latest.length) feed.textContent = '推进游戏后显示公开判断。'; else latest.forEach(decision => { const item = document.createElement('div'); item.className = 'message'; const title = document.createElement('div'); title.textContent = `${nameOf(decision.agentId)} · ${decisionSource(decision)}`; item.append(title); appendDecisionDetails(item, decision); feed.append(item); });
      const role = labels[privateState?.role] || privateState?.role || '未知';
      $('privateState').textContent = privateState ? `你的身份：${role}。${privateState.teammates?.length ? `队友：${privateState.teammates.map(nameOf).join('、')}。` : ''} ${privateState.nightKnowledge?.length ? `查验记录：${privateState.nightKnowledge.map(item => `${nameOf(item.target)}=${item.result}`).join('，')}。` : ''}` : '尚未开始';
      const waiting = game.awaitingHuman === 'message' ? '轮到你发言。' : game.awaitingHuman === 'vote' ? '轮到你投票。' : game.awaitingHuman === 'spectate' ? '你已出局，当前为观战状态；点击“推进一步”继续查看 Jev 的行动。' : game.phase === 'finished' ? `本局结束：${game.winner === 'good' ? '好人胜利' : '狼人胜利'}。` : 'Jev 正在推进下一步。';
      $('turnHint').textContent = waiting;
      $('message').disabled = game.awaitingHuman !== 'message'; $('sendMessage').disabled = game.awaitingHuman !== 'message'; $('voteTarget').disabled = game.awaitingHuman !== 'vote'; $('sendVote').disabled = game.awaitingHuman !== 'vote';
      const targets = game.awaitingHuman === 'vote' ? game.alive.filter(id => id !== game.humanId) : []; $('voteTarget').replaceChildren(...targets.map(id => { const option = document.createElement('option'); option.value = id; option.textContent = nameOf(id); return option; }));
      if (game.winner) setStatus(`第 ${game.round} 轮结束：${game.winner === 'good' ? '好人胜利' : '狼人胜利'}。可以点击“揭示身份”查看完整调试 trace。`, game.winner === 'good' ? 'good' : 'bad');
    }
    async function refresh(data) { game = data.game; privateState = data.privateState; gameId = game.gameId; render(); if (game.phase === 'finished') setStatus(`本局结束：${game.winner === 'good' ? '好人胜利' : '狼人胜利'}。`, game.winner === 'good' ? 'good' : 'bad'); else if (game.awaitingHuman === 'message') setStatus('轮到你发言。'); else if (game.awaitingHuman === 'vote') setStatus('轮到你投票。'); else if (game.awaitingHuman === 'spectate') setStatus('你已出局，当前为观战状态。'); else setStatus(game.mode === 'auto' ? '新局已开始，Jev 正在推进夜晚和公共讨论。' : '离线新局已开始，Jev 正在推进夜晚和公共讨论。'); }
    $('newGame').onclick = async () => { try { setStatus('正在创建新局……'); const data = await api('/api/game/new', { seed: $('seed').value }); await refresh(data); await advance(); } catch (error) { setStatus(error.message, 'bad'); } };
    async function advance() { if (!gameId) return; try { const data = await api(`/api/game/${gameId}/advance`, {}); await refresh(data); } catch (error) { setStatus(error.message, 'bad'); } }
    $('advance').onclick = advance;
    $('sendMessage').onclick = async () => { try { const text = $('message').value; const data = await api(`/api/game/${gameId}/human-message`, { text }); $('message').value = ''; await refresh(data); } catch (error) { setStatus(error.message, 'bad'); } };
    $('sendVote').onclick = async () => { try { const data = await api(`/api/game/${gameId}/vote`, { target: $('voteTarget').value }); await refresh(data); } catch (error) { setStatus(error.message, 'bad'); } };
    $('revealDebug').onclick = async () => { if (!gameId) return; try { const data = await api(`/api/game/${gameId}/reveal-debug`, {}); $('debug').hidden = false; $('debug').textContent = JSON.stringify(data, null, 2); } catch (error) { setStatus(error.message, 'bad'); } };
    $('saveTrace').onclick = async () => { if (!gameId) return; try { const data = await api('/api/trace', { gameId }); setStatus(`trace 已保存：${data.filename}`, 'good'); } catch (error) { setStatus(error.message, 'bad'); } };
  </script>
</body>
</html>
